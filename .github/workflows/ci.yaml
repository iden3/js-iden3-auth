name: RUN ES LINT ANS TESTS
on: push
jobs:
  build:
    timeout-minutes: 7
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
  
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Cache node modules
        id: cache-npm
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          # npm cache files are stored in `~/.npm` on Linux/macOS
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      # if tests fail, this step may show what dependencies are changed.
      - if: ${{ steps.cache-npm.outputs.cache-hit != 'true' }}
        name: List the state of node modules
        continue-on-error: true
        run: npm list

      - name: Install modules
        run: npm ci

      - name: Run Prettier
        run: npm run format

      - name: Run ESLint
        run: npm run lint

      - name: Run Build
        run: npm run build

      - name: Download regular circuits for CI 'latest.zip' from S3
        run: mkdir ./test/testdata && wget https://circuits.privado.id/latest.zip -P ./test/testdata

      - name: Unzip circuits to folder
        run: cd ./test/testdata && unzip latest.zip && cd - && pwd

      - name: Run Tests
        run: npm run test
